<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e5598c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LaporBantu">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>LaporBantu Smadita</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

:root{
  --pink-50:#fff7fa; --pink-100:#ffe9f2; --pink-200:#ffd3e4; --pink-300:#ffabc9;
  --pink-400:#f47ea6; --pink-500:#e5598c; --pink-600:#c63f75;
  --ink:#4a1f34; --muted:#8c6679; --line:#f5d5e3;
  --ok:#1d7a54; --ok-bg:#dcf5ea; --err:#c2344f;
  --shadow:0 18px 40px -20px rgba(198,63,117,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:var(--pink-50);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none !important}

/* ---------- Latar animasi ---------- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(-45deg,#fff7fa,#ffe9f2,#ffd3e4,#fff0f6);background-size:400% 400%;animation:gradient 16s ease infinite}
.bg span{position:absolute;border-radius:50%;filter:blur(40px);opacity:.45;animation:float 14s ease-in-out infinite}
.bg span:nth-child(1){width:340px;height:340px;background:var(--pink-300);top:-80px;left:-60px}
.bg span:nth-child(2){width:420px;height:420px;background:var(--pink-400);bottom:-140px;right:-100px;animation-delay:-5s}
.bg span:nth-child(3){width:240px;height:240px;background:var(--pink-200);top:40%;left:45%;animation-delay:-9s}
@keyframes gradient{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-40px) scale(1.08)}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.anim-in{animation:up .5s cubic-bezier(.2,.7,.2,1) both}
.stagger>*{animation:up .5s cubic-bezier(.2,.7,.2,1) both}
.stagger>*:nth-child(2){animation-delay:.08s}
.stagger>*:nth-child(3){animation-delay:.16s}
.stagger>*:nth-child(4){animation-delay:.24s}

/* ---------- Loader & toast ---------- */
.loader{position:fixed;inset:0;display:grid;place-items:center;background:rgba(255,247,250,.75);backdrop-filter:blur(4px);z-index:50;transition:opacity .3s}
.spinner{width:44px;height:44px;border-radius:50%;border:4px solid var(--pink-200);border-top-color:var(--pink-600);animation:spin .8s linear infinite}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,24px);opacity:0;background:var(--ink);color:#fff;padding:13px 20px;border-radius:14px;font-weight:600;font-size:14px;box-shadow:0 18px 40px -16px rgba(74,31,52,.6);transition:.35s;z-index:60;max-width:90vw;pointer-events:none;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{background:var(--ok)}
.toast.err{background:var(--err)}

/* ---------- Halaman masuk ---------- */
#auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:48px;padding:48px 6vw}
.auth-hero h1{font-size:clamp(34px,4.5vw,52px);font-weight:800;line-height:1.05;letter-spacing:-.02em;color:var(--pink-600)}
.auth-hero p{margin-top:16px;color:var(--muted);font-size:16px;line-height:1.6;max-width:440px}
.logo-lg{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,var(--pink-400),var(--pink-600));color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px;box-shadow:0 14px 30px -12px var(--pink-600);margin-bottom:24px;animation:pop .6s both}
.auth-card{background:rgba(255,255,255,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.9);border-radius:28px;padding:34px;box-shadow:var(--shadow);max-width:430px;width:100%;justify-self:end;animation:up .6s both}
@media(max-width:860px){#auth{grid-template-columns:1fr;padding:32px 20px}.auth-card{justify-self:stretch}}

.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--pink-100);border-radius:14px;padding:5px;margin-bottom:22px}
.seg button{border:0;background:transparent;padding:11px;border-radius:10px;cursor:pointer;font-weight:700;color:var(--muted);transition:.25s}
.seg button.on{background:#fff;color:var(--pink-600);box-shadow:0 8px 16px -10px rgba(198,63,117,.6)}
.title{font-size:22px;font-weight:800}
.muted{color:var(--muted);font-size:13px;line-height:1.55;margin-top:6px}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:16px 0 7px}
input,select{width:100%;padding:13px 15px;border:1.5px solid var(--line);border-radius:14px;background:#fff;outline:none;transition:.25s}
input:focus,select:focus{border-color:var(--pink-400);box-shadow:0 0 0 4px var(--pink-100);transform:translateY(-1px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 20px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--pink-500),var(--pink-600));color:#fff;box-shadow:0 12px 24px -14px var(--pink-600);transition:transform .2s,box-shadow .2s,opacity .2s;position:relative}
.btn:hover{transform:translateY(-2px);box-shadow:0 16px 30px -14px var(--pink-600)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn.loading{color:transparent}
.btn.loading::after{content:"";position:absolute;width:18px;height:18px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.btn.ghost{background:var(--pink-100);color:var(--pink-600);box-shadow:none}
.btn.danger{background:var(--err);box-shadow:none}
.btn.block{width:100%;margin-top:22px}
.link{border:0;background:none;color:var(--pink-600);font-weight:700;cursor:pointer;padding:0}
.link:hover{text-decoration:underline}
.switch{margin-top:18px;text-align:center;font-size:14px;color:var(--muted)}

/* ---------- Aplikasi ---------- */
#app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:4px 10px 22px}
.brand .logo-lg{width:42px;height:42px;font-size:15px;border-radius:14px;margin:0;animation:none}
.brand b{display:block;font-weight:800}
.brand small{color:var(--muted);font-size:12px}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border:0;background:transparent;border-radius:14px;cursor:pointer;font-weight:600;font-size:14px;text-align:left;transition:.2s;width:100%}
.nav-item:hover{background:var(--pink-50);transform:translateX(3px)}
.nav-item.on{background:var(--pink-100);color:var(--pink-600);font-weight:800}
.nav-item.lock{opacity:.5;cursor:not-allowed}
.nav-item.lock:hover{transform:none;background:transparent}
.nav-item .fase{margin-left:auto;font-size:10px;font-weight:800;background:var(--pink-200);color:var(--pink-600);padding:3px 8px;border-radius:999px}
.side-foot{margin-top:auto;padding-top:16px;display:grid;gap:12px}
main{padding:32px 40px 60px;min-width:0}
.topbar{margin-bottom:26px}
.topbar h1{font-size:28px;font-weight:800;letter-spacing:-.02em}
.topbar p{color:var(--muted);font-size:14px;margin-top:4px}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--pink-200),var(--pink-300));display:grid;place-items:center;font-weight:800;color:var(--pink-600);flex:none}
.userchip{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.userchip b{display:block;font-size:14px}
.userchip small{color:var(--muted);font-size:12px}
.card{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:var(--shadow);transition:transform .25s,box-shadow .25s;min-width:0}
.card:hover{transform:translateY(-3px);box-shadow:0 26px 50px -24px rgba(198,63,117,.45)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px}
.span-4{grid-column:span 4}.span-6{grid-column:span 6}.span-8{grid-column:span 8}.span-12{grid-column:span 12}
.card-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.card-head h3{font-size:17px;font-weight:800}
.ic{width:40px;height:40px;border-radius:14px;background:var(--pink-100);display:grid;place-items:center;font-size:18px;flex:none}
.hero-card{background:linear-gradient(140deg,var(--pink-600),var(--pink-400));color:#fff;border:0}
.hero-card .muted{color:rgba(255,255,255,.92);font-size:15px;margin-top:8px}
.hero-card h2{font-size:26px;font-weight:800}
.steps{display:grid;gap:12px}
.step{display:flex;gap:14px;align-items:center;padding:14px;border-radius:16px;border:1px solid var(--line);background:#fff}
.step .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--pink-100);color:var(--pink-600);flex:none}
.step.done{border-color:#bfe8d6}
.step.done .dot{background:var(--ok);color:#fff}
.step small{color:var(--muted);font-size:12px}
.kv{display:grid;gap:10px}
.kv div{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.kv span{color:var(--muted)}
.kv b{font-weight:700}

@media(max-width:1000px){
  #app{grid-template-columns:1fr}
  aside{position:static;height:auto}
  main{padding:20px 16px}
  .span-4,.span-6,.span-8{grid-column:span 12}
}
/* ---------- Phase 2: siswa ---------- */
.span-5{grid-column:span 5}.span-7{grid-column:span 7}
@media(max-width:1000px){.span-5,.span-7{grid-column:span 12}}
.mt{margin-top:16px}
.stack{display:grid;gap:16px;min-width:0;align-content:start}
.stack-list{display:grid;gap:14px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:4px}
.section-head h3{font-size:17px;font-weight:800}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.cta .btn{width:auto}
.btn.light{background:#fff;color:var(--pink-600);box-shadow:none}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px}
.stat{background:var(--pink-50);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:800;color:var(--pink-600)}
.stat small{color:var(--muted);font-size:12px}
.reports{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.report{padding:0;overflow:hidden;display:flex;flex-direction:column}
.thumb{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:var(--pink-100)}
.thumb.ph{display:grid;place-items:center;font-size:32px;color:var(--pink-400)}
.rbody{padding:18px;display:grid;gap:12px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--pink-100);color:var(--pink-600)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.p-tinggi{background:#ffe0e6;color:var(--err)}
.tag.p-sedang{background:#fff1d6;color:#9a6200}
.tag.p-rendah{background:#e4f1ff;color:#2c6aa8}
.desk{font-size:14px;line-height:1.6}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.side-act{display:flex;align-items:center;gap:8px}
.status{font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px}
.st-menunggu{background:#fff1d6;color:#9a6200}
.st-diproses{background:#e4f1ff;color:#2c6aa8}
.st-selesai{background:var(--ok-bg);color:var(--ok)}
textarea{width:100%;padding:13px 15px;border:1.5px solid var(--line);border-radius:14px;background:#fff;outline:none;resize:vertical;min-height:110px;transition:.25s}
textarea:focus{border-color:var(--pink-400);box-shadow:0 0 0 4px var(--pink-100)}
.counter{text-align:right;font-size:12px;color:var(--muted);margin-top:6px}
.opsional{font-size:11px;font-weight:800;background:var(--pink-100);color:var(--pink-600);padding:2px 8px;border-radius:999px;margin-left:6px}
.upload{display:block;margin:0;position:relative;cursor:pointer;border:2px dashed var(--pink-300);border-radius:18px;background:#fff;padding:18px;text-align:center;transition:.25s}
.upload:hover{background:var(--pink-50);border-color:var(--pink-400)}
.upload input{position:absolute;width:1px;height:1px;opacity:0;padding:0;border:0}
.up-txt{font-weight:700;color:var(--pink-600)}
.up-txt small{display:block;color:var(--muted);font-weight:500;margin-top:4px;font-size:12px}
.prev{max-height:200px;border-radius:12px;margin:0 auto;display:block}
.ganti{display:block;margin-top:8px;color:var(--muted);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{margin:0;position:relative;cursor:pointer}
.chip input{position:absolute;opacity:0;width:1px;height:1px;padding:0;border:0}
.chip span{display:inline-block;padding:10px 16px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:14px;color:var(--muted);transition:.2s}
.chip:hover span{border-color:var(--pink-300)}
.chip input:checked + span{background:var(--pink-500);border-color:var(--pink-500);color:#fff;box-shadow:0 10px 18px -12px var(--pink-600)}
.chip input:focus-visible + span{box-shadow:0 0 0 4px var(--pink-100)}
.denah{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.zone{border-radius:18px;padding:16px;border:1px solid var(--line);background:#fff;display:grid;gap:4px;transition:transform .25s}
.zone:hover{transform:translateY(-3px)}
.zone b{font-size:14px}
.zone .count{font-size:26px;font-weight:800;color:var(--pink-600)}
.zone small{color:var(--muted);font-size:12px}
.zone.lv1{background:var(--pink-50)}
.zone.lv2{background:var(--pink-100)}
.zone.lv3{background:var(--pink-200)}
.zone.lv4{background:linear-gradient(135deg,var(--pink-300),var(--pink-400));color:#fff;border-color:transparent}
.zone.lv4 .count,.zone.lv4 small{color:#fff}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:5px;display:inline-block;border:1px solid var(--line)}
.legend i.lv1{background:var(--pink-50)}
.legend i.lv3{background:var(--pink-200)}
.legend i.lv4{background:var(--pink-400)}
.rank{display:flex;align-items:center;gap:14px;padding:12px;border-radius:16px;border:1px solid var(--line);background:#fff;margin-bottom:10px}
.rank.saya{background:var(--pink-100);border-color:var(--pink-300)}
.pos{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-weight:800;background:var(--pink-100);color:var(--pink-600);flex:none}
.rank.saya .pos{background:var(--pink-500);color:#fff}
.nm{flex:1;min-width:0;display:grid}
.nm small,.pts small{color:var(--muted);font-size:12px}
.pts{font-weight:800;font-size:16px;white-space:nowrap}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.badge-card{border:1.5px dashed var(--pink-300);border-radius:20px;padding:18px;text-align:center;display:grid;gap:6px;justify-items:center;opacity:.6;background:#fff}
.badge-card.on{opacity:1;border-style:solid;background:linear-gradient(160deg,#fff,var(--pink-50));box-shadow:var(--shadow)}
.bi{font-size:36px}
.badge-card small{color:var(--muted);font-size:12px}
.avatar.xl{width:84px;height:84px;font-size:28px;margin-bottom:14px}
.profil{text-align:center;display:grid;justify-items:center}
.profil .stats{width:100%}
.nav-item .badge{margin-left:auto;background:var(--pink-500);color:#fff;font-size:11px;font-weight:800;min-width:22px;height:22px;border-radius:999px;display:grid;place-items:center;padding:0 7px}
.notif{display:flex;gap:14px;align-items:flex-start;padding:18px}
.notif p{font-size:14px;line-height:1.5}
.notif small{color:var(--muted);font-size:12px}
.notif.baru{border-color:var(--pink-300);background:linear-gradient(120deg,#fff,var(--pink-50))}
.skeleton{border-radius:18px;background:linear-gradient(90deg,var(--pink-100) 25%,#fff 50%,var(--pink-100) 75%);background-size:200% 100%;animation:shimmer 1.4s linear infinite;min-height:120px}
@keyframes shimmer{to{background-position:-200% 0}}
.empty{text-align:center;display:grid;justify-items:center;gap:8px;padding:34px 24px}
.empty h3{font-size:18px;font-weight:800;margin-top:6px}
.empty .ic.big{width:64px;height:64px;font-size:30px;border-radius:22px}
.empty .btn{margin-top:10px}
.errbox{border:1px solid #f5c2cd;background:#fff5f7}
details.faq{border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:#fff;margin-top:10px}
details.faq summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.faq summary::after{content:"+";color:var(--pink-600);font-weight:800;font-size:18px}
details.faq[open] summary::after{content:"–"}
details.faq p{margin-top:10px;color:var(--muted);font-size:14px;line-height:1.6}

/* ---------- Phase 3: admin ---------- */
.filterbar{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;padding:18px 20px;margin-bottom:18px}
.filterbar label{margin:0;flex:1;min-width:170px}
.verif-row{display:flex;gap:10px;align-items:center;margin-top:4px}
.verif-row select{flex:1;min-width:0;padding:10px 12px;border-radius:12px}
.btn.ghost.danger{color:#fff}
.timer-row{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);margin-top:4px}
.timer{font-size:17px;font-weight:800;color:var(--pink-600);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.form-selesai{display:grid;gap:12px;margin-top:6px}
.wajib{font-size:11px;font-weight:800;color:var(--err);background:#ffe0e6;padding:2px 8px;border-radius:999px;margin-left:6px}
.hist{display:grid;grid-template-columns:150px 1fr 190px;gap:18px;align-items:center;padding:16px}
.hthumb{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:16px;background:var(--pink-100);display:block}
.hthumb.ph{display:grid;place-items:center;font-size:28px;color:var(--pink-400)}
.hbody{display:grid;gap:10px;min-width:0}
.durasi{display:grid;gap:4px;text-align:right;justify-items:end}
.durasi small{color:var(--muted);font-size:12px}
.durasi b{font-size:18px;font-weight:800;color:var(--pink-600)}
.grow{flex:1;min-width:0}
.bar-row{display:grid;grid-template-columns:120px 1fr 40px;gap:10px;align-items:center;margin-bottom:12px;font-size:13px}
.bar-nama{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:10px;border-radius:99px;background:var(--pink-100);overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pink-300),var(--pink-500));animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{width:0}}
.bar-angka{text-align:right}
@media(max-width:700px){.hist{grid-template-columns:1fr}.durasi{text-align:left;justify-items:start}}

/* ---------- Ikon SVG ---------- */
.ico{width:18px;height:18px;flex:none;display:inline-block;vertical-align:middle}
.ic{color:var(--pink-600)}
.ic .ico{width:22px;height:22px}
.empty .ic.big .ico{width:30px;height:30px}
.thumb.ph .ico,.hthumb.ph .ico{width:34px;height:34px;opacity:.55}
.nav-item>span:first-child{display:inline-grid;place-items:center;width:22px;flex:none}
.nav-item .ico{width:20px;height:20px}
.btn .ico{width:18px;height:18px}
.tag .ico,.meta .ico,.timer-row .ico,.up-txt .ico{width:15px;height:15px}
.up-txt .ico{display:inline-block;margin-right:4px}
.pos .ico{width:18px;height:18px}
.step .dot .ico{width:16px;height:16px}
.bi{color:var(--pink-600)}
.bi .ico{width:38px;height:38px;stroke-width:1.6}

/* ---------- Logo gambar ---------- */
.logo-img{width:42px;height:42px;object-fit:contain;flex:none;filter:drop-shadow(0 8px 14px rgba(198,63,117,.35))}
.logo-img-lg{width:88px;height:88px;margin-bottom:22px;animation:pop .6s both}
.brand .logo-img{width:42px;height:42px;margin:0}

/* ---------- Info aplikasi ---------- */
.info-hero{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.info-logo{width:88px;height:88px;object-fit:contain;flex:none;background:rgba(255,255,255,.2);border-radius:24px;padding:8px}
.info-hero h2{font-size:clamp(20px,3.4vw,28px);letter-spacing:.02em}
.info-hero .muted{margin-top:6px}
.info-teks{font-size:15px;line-height:1.75}
.info-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.info-tags .tag{font-size:13px;padding:7px 12px}
.info-meta{display:grid;gap:6px;margin-top:12px;font-size:14px}
.info-meta b{color:var(--pink-600)}
.info-kutip{text-align:center;display:grid;justify-items:center;padding:30px 24px}
.info-kutip p{font-size:clamp(17px,2.4vw,22px);font-weight:800;color:var(--pink-600);line-height:1.4}
.info-overlay{position:fixed;inset:0;z-index:70;background:rgba(74,31,52,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);overflow-y:auto;padding:28px 16px}
.info-sheet{position:relative;max-width:1000px;margin:0 auto;background:var(--pink-50);border-radius:28px;padding:58px 22px 22px;box-shadow:var(--shadow);animation:up .4s both}
.info-tutup{position:absolute;top:16px;right:16px}
.info-login{display:flex;justify-content:center;margin-top:18px}
.info-login .link{display:inline-flex;align-items:center;gap:8px;font-size:14px}
.info-login .ico{width:16px;height:16px}

/* ---------- Tampilan HP ---------- */
@media (max-width:860px){
  #auth{grid-template-columns:1fr;gap:26px;padding:28px 18px 40px;justify-items:center}
  .auth-hero{text-align:center;display:flex;flex-direction:column;align-items:center}
  .auth-hero h1{font-size:34px}
  .auth-hero p{margin-left:auto;margin-right:auto;font-size:15px}
  .auth-card{justify-self:stretch;max-width:520px;padding:26px 22px;border-radius:24px}
}
@media (max-width:700px){
  aside{position:sticky;top:0;z-index:30;height:auto;flex-direction:row;align-items:center;gap:6px;padding:10px 12px;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--line);scrollbar-width:none;background:rgba(255,255,255,.94)}
  aside::-webkit-scrollbar{display:none}
  .brand{padding:0 6px 0 0;flex:none}
  .brand>div:last-child{display:none}
  .brand .logo-img{width:36px;height:36px}
  .nav-item{width:auto;flex:none;padding:9px 13px;font-size:13px;white-space:nowrap;border-radius:999px}
  .nav-item:hover{transform:none}
  .nav-item .badge{margin-left:4px}
  .side-foot{margin:0 0 0 auto;padding:0;display:flex;flex:none}
  .userchip{display:none}
  .side-foot .btn.block{width:auto;margin:0;padding:9px 14px;font-size:13px;white-space:nowrap}
  main{padding:18px 14px 64px}
  .topbar{margin-bottom:18px}
  .topbar h1{font-size:22px}
  .topbar p{font-size:13px}
  .card{padding:18px;border-radius:20px}
  .card-head{margin-bottom:12px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero-card h2{font-size:22px}
  .cta .btn{flex:1 1 auto}
  .reports{grid-template-columns:1fr}
  .info-sheet{padding:54px 14px 16px;border-radius:22px}
  .info-overlay{padding:16px 10px}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
/* ---------- Profil siswa (Opsi 3) dan sentuhan hidup ---------- */
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.profil-grid{align-items:start}
.profil-kiri{grid-column:span 5;text-align:center}
.profil-kanan{grid-column:span 7;display:grid;gap:20px}
.polaroid{position:relative;width:min(100%,260px);box-sizing:border-box;margin:18px auto 0;padding:14px 14px 56px;background:#fff;border-radius:8px;transform:rotate(-2deg);box-shadow:0 18px 34px -20px rgba(74,31,52,.5);transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
.polaroid:hover{transform:rotate(0) translateY(-4px);box-shadow:0 26px 44px -22px rgba(198,63,117,.5)}
.tape{position:absolute;top:-12px;left:50%;width:90px;height:24px;margin-left:-45px;background:rgba(255,211,228,.9);transform:rotate(3deg);border-radius:3px}
.foto-kotak{aspect-ratio:1/1;border-radius:4px;overflow:hidden;background:var(--pink-100);display:grid;place-items:center}
.foto-kotak img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.polaroid:hover .foto-kotak img{transform:scale(1.06)}
.foto-kotak .ico{width:86px;height:86px;color:var(--pink-500)}
.polaroid-nama{position:absolute;left:0;right:0;bottom:16px;margin:0;text-align:center;font-size:18px;font-weight:800;color:var(--ink)}
.profil-meta{margin:20px 0 0;color:var(--muted);font-size:14px}
.pusat{margin-top:12px}
.stat-pita{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat-pita>div{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 8px;text-align:center;box-shadow:var(--shadow);transition:transform .25s}
.stat-pita>div:nth-child(odd){transform:rotate(-1.5deg)}
.stat-pita>div:nth-child(even){transform:rotate(1.5deg);background:var(--pink-50)}
.stat-pita>div:hover{transform:translateY(-4px) rotate(0)}
.stat-pita b{display:block;font-size:24px;font-weight:800;color:var(--pink-600)}
.stat-pita small{color:var(--muted);font-size:12px}
.rak{padding:22px}
.rak-head h3{margin:0;font-size:18px;font-weight:800}
.rak-head small{color:var(--muted);font-size:13px}
.medali-rak{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:18px;text-align:center}
.medali-item b{display:block;margin-top:10px;font-size:13px}
.medali-item small{display:block;font-size:12px;color:var(--muted)}
.medali{position:relative;overflow:hidden;width:84px;height:84px;margin:0 auto;box-sizing:border-box;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px dashed var(--pink-300);color:var(--muted)}
.medali .ico{width:34px;height:34px}
.medali.on{background:linear-gradient(145deg,var(--pink-500),var(--pink-600));border:0;color:#fff;box-shadow:0 12px 22px -12px rgba(198,63,117,.7);animation:pop .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*.12s + .2s)}
.medali.on::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:kilau 4s ease-in-out infinite;animation-delay:calc(var(--i,0)*.6s + 1s)}
@keyframes kilau{0%{left:-60%}40%,100%{left:120%}}
.rak-papan{height:10px;margin-top:16px;border-radius:999px;background:linear-gradient(90deg,var(--pink-200),var(--pink-300));box-shadow:0 6px 12px -8px rgba(198,63,117,.6)}
.grid>.anim-in:nth-child(2){animation-delay:.08s}
.grid>.anim-in:nth-child(3){animation-delay:.16s}
.grid>.anim-in:nth-child(4){animation-delay:.24s}
.avatar{overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:760px){.profil-kiri,.profil-kanan{grid-column:1/-1}}
@media (max-width:600px){.profil-grid{padding-bottom:150px}}
@media (prefers-reduced-motion:reduce){.medali.on,.medali.on::after{animation:none}}
</style>

</head>

/* =========================================================
 * Siswa.html — halaman siswa (Phase 2), sisi klien
 * Setiap fungsi halaman mengembalikan HTML (string) atau Promise<string>.
 * Dipanggil dari HALAMAN di Client.html.
 * ========================================================= */

const STATUS_LABEL = { menunggu: 'Menunggu', diproses: 'Sedang Diperbaiki', selesai: 'Selesai' };
const STATUS_CLS = { menunggu: 'st-menunggu', diproses: 'st-diproses', selesai: 'st-selesai' };
const PRIO_CLS = { Tinggi: 'p-tinggi', Sedang: 'p-sedang', Rendah: 'p-rendah' };

/* ---------- Pembantu tampilan ---------- */
function tgl(iso) {
  if (!iso) return '-';
  return new Date(iso).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short', timeZone: 'Asia/Jakarta' });
}

function opts(list) {
  return list.map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join('');
}

function kosongBox(ikon, judul, isi, aksi = '') {
  return `
  <div class="card empty anim-in">
    <div class="ic big">${ikon}</div>
    <h3>${esc(judul)}</h3>
    <p class="muted">${esc(isi)}</p>
    ${aksi}
  </div>`;
}

function statusPill(s) {
  return `<span class="status ${STATUS_CLS[s] || ''}">${esc(STATUS_LABEL[s] || s)}</span>`;
}

function aksiDukung(r) {
  if (r.milikSaya) return `<span class="tag">Laporanmu sendiri</span>`;
  if (r.status === 'selesai') return `<span class="tag ok">Sudah selesai</span>`;
  if (r.sudahDukung) return `<span class="tag ok">Sudah kamu dukung</span>`;
  return `<button type="button" class="btn ghost sm" data-dukung="${esc(r.id)}">${ikon('thumbs')} Dukung</button>`;
}

function kartuLaporan(r) {
  const foto = r.fotoUrl
    ? `<img class="thumb" src="${esc(r.fotoUrl)}" alt="Foto laporan" loading="lazy">`
    : `<div class="thumb ph">${ikon('camera')} </div>`;
  return `
  <article class="card report anim-in">
    ${foto}
    <div class="rbody">
      <div class="tags">
        <span class="tag">${esc(r.kategori)}</span>
        <span class="tag">${ikon('pin')} ${esc(r.lokasi)}</span>
        <span class="tag ${PRIO_CLS[r.prioritas] || ''}">${esc(r.prioritas)}</span>
      </div>
      <p class="desk">${esc(r.deskripsi)}</p>
      <div class="meta">
        ${statusPill(r.status)}
        <span>${ikon('clock')} ${tgl(r.createdAt)}</span>
        <span>${ikon('thumbs')} ${r.dukungan} dukungan</span>
      </div>
      <div class="side-act">${aksiDukung(r)}</div>
    </div>
  </article>`;
}

/** Denah: kotak per lokasi, makin pekat jika laporan aktif makin banyak */
function denahHTML(zona) {
  const maks = Math.max(1, ...zona.map(z => z.aktif));
  const kotak = zona.map(z => {
    const level = z.aktif === 0 ? 0 : Math.max(1, Math.ceil((z.aktif / maks) * 4));
    return `
      <div class="zone lv${level}">
        <b>${esc(z.lokasi)}</b>
        <span class="count">${z.aktif}</span>
        <small>${z.tinggi > 0 ? ikon('alert') + ' ' + z.tinggi + ' prioritas tinggi' : 'laporan aktif'}</small>
      </div>`;
  }).join('');
  return `
    <div class="denah">${kotak}</div>
    <div class="legend">
      <span><i class="lv1"></i>Sedikit</span>
      <span><i class="lv3"></i>Sedang</span>
      <span><i class="lv4"></i>Banyak</span>
    </div>`;
}

function rankRow(p, i, kelasSaya) {
  const saya = p.kelas === kelasSaya;
  return `
  <div class="rank ${saya ? 'saya' : ''}">
    <div class="pos">${i + 1}</div>
    <div class="nm"><b>Kelas ${esc(p.kelas)}</b><small>${p.siswa} siswa${saya ? ' · kelasmu' : ''}</small></div>
    <div class="pts">${p.poin} <small>poin</small></div>
  </div>`;
}

function listPengumuman(list) {
  if (!list.length) return '<p class="muted">Belum ada pengumuman dari admin.</p>';
  return `<div class="steps">${list.map(p => `
    <div class="step">
      <div class="dot">${ikon('megaphone')} </div>
      <div><b>${esc(p.teks)}</b><br><small>${esc(p.oleh)} · ${tgl(p.createdAt)}</small></div>
    </div>`).join('')}</div>`;
}

      <div class="cta">

      <div class="card">

    <div class="card span-12">
      <div class="card-head"><div class="ic">${ikon('map')} </div><h3>Peta Masalah</h3></div>
      <p class="muted">${d.sekitarTotal} laporan aktif dari siswa lain. Angka menunjukkan jumlah laporan belum selesai per area.</p>
      <div class="mt">${denahHTML(d.zona)}</div>
    </div>
  </div>`;
}

/** Mengecilkan foto ke maks 1000px (JPEG 80%) agar ringan dikirim ke server */
function kompresFoto(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const skala = Math.min(1, 1000 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * skala);
      c.height = Math.round(img.height * skala);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error('Foto tidak bisa dibaca. Pilih file gambar lain.'));
    };
    img.src = url;
  });
}

async function kirimLapor(f) {

  <script>
/* =========================================================
 * HalamanAdmin.html — halaman admin (Phase 3), sisi klien
 * Beranda, Masuk Baru, Proses Perbaikan, dan Riwayat Selesai.
 * Halaman Statistik, Verifikator, dan Pengumuman ada di HalamanAdminKelola.html
 * ========================================================= */

/* Foto bukti perbaikan yang sudah dipilih, per laporan, sebelum dikirim */
const BUKTI = new Map();

/* ---------- Waktu ---------- */

/** Durasi berjalan, format 03:15:09 atau 2 hari 03:15:09 */
function durasiLive(ms) {
  const detik = Math.max(0, Math.floor(ms / 1000));
  const hari = Math.floor(detik / 86400);
  const jam = Math.floor((detik % 86400) / 3600);
  const menit = Math.floor((detik % 3600) / 60);
  const dtk = detik % 60;
  const p = n => String(n).padStart(2, '0');
  return (hari ? hari + ' hari ' : '') + p(jam) + ':' + p(menit) + ':' + p(dtk);
}

/** Durasi selesai, format ringkas: 2 hari 3 jam, 3 jam 15 menit */
function durasiTeks(ms) {
  if (!ms || ms < 0) return '-';
  const menit = Math.floor(ms / 60000);
  const hari = Math.floor(menit / 1440);
  const jam = Math.floor((menit % 1440) / 60);
  const mnt = menit % 60;
  const bagian = [];
  if (hari) bagian.push(hari + ' hari');
  if (jam) bagian.push(jam + ' jam');
  if (mnt || !bagian.length) bagian.push(mnt + ' menit');
  return bagian.join(' ');
}

/** Menyalakan timer di halaman yang punya [data-mulai]. Dipanggil setiap halaman dimuat. */
function aktifkanTimer() {
  clearInterval(S.timer);
  if (!document.querySelector('[data-mulai]')) return;
  const tick = () => {
    document.querySelectorAll('[data-mulai]').forEach(el => {
      el.textContent = durasiLive(Date.now() - new Date(el.dataset.mulai).getTime());
    });
  };
  tick();
  S.timer = setInterval(tick, 1000);
}

/* ---------- Kartu ---------- */

function optsPilih(list, pilih, labelKosong) {
  const awal = labelKosong ? `<option value="">${esc(labelKosong)}</option>` : '';
  return awal + list.map(o => `<option value="${esc(o)}" ${o === pilih ? 'selected' : ''}>${esc(o)}</option>`).join('');
}

function fotoKecil(url, kelas = 'thumb') {
  return url
    ? `<img class="${kelas}" src="${esc(url)}" alt="Foto laporan" loading="lazy">`
    : `<div class="${kelas} ph">${ikon('camera')} </div>`;
}

/** Kartu laporan untuk admin. isi = blok aksi di bagian bawah kartu. */
function kartuAdmin(r, isi = '') {
  return `
  <article class="card report anim-in">
    ${fotoKecil(r.fotoUrl)}
    <div class="rbody">
      <div class="tags">

      </div>

      </div>

    </div>
  </article>`;
}

/* ---------- Beranda admin ---------- */
async function pageBerandaAdmin() {
  const d = await panggil('dataBerandaAdmin', S.token);
  S.antrian = d.menunggu;
  karakterSapaAdmin(d);
  const nama = S.user.nama.split(' ')[0];
  const terbaru = d.terbaru.length
    ? d.terbaru.map(r => kartuAdmin(r)).join('')

  return `
  <div class="grid stagger">

      <h2>Halo, ${esc(nama)}</h2>
      <p class="muted">${d.menunggu} laporan menunggu verifikasi${d.menungguTinggi ? `, termasuk ${d.menungguTinggi} prioritas Tinggi` : ''}.</p>
      <div class="cta">

/* ---------- Masuk baru ---------- */
async function pageMasuk() {
  S.filter = S.filter || { kategori: '', prioritas: '', urut: 'dukungan' };
  const [list, verif] = await Promise.all([
    panggil('masukBaru', S.token, S.filter),
    panggil('daftarVerifikator', S.token)
  ]);
  S.antrian = list.length;
  const f = S.filter;

  const filterBar = `
    <form id="fFilter" class="card filterbar anim-in" autocomplete="off">
      <label>Kategori
        <select name="kategori">${optsPilih(CFG.kategori, f.kategori, 'Semua kategori')}</select>
      </label>
      <label>Prioritas
        <select name="prioritas">${optsPilih(CFG.prioritas, f.prioritas, 'Semua prioritas')}</select>
      </label>
      <label>Urutkan
        <select name="urut">
          <option value="dukungan" ${f.urut !== 'terbaru' ? 'selected' : ''}>Dukung Terbanyak</option>
          <option value="terbaru" ${f.urut === 'terbaru' ? 'selected' : ''}>Terbaru</option>
        </select>
      </label>
    </form>`;

  const isi = list.length
    ? list.map(r => kartuAdmin(r, aksiVerif(r, verif))).join('')
    : kosongBox(ikon('inbox'), 'Tidak ada laporan baru', 'Semua laporan sudah diverifikasi, atau tidak ada yang cocok dengan filter.');

  return `${filterBar}<div class="reports stagger">${isi}</div>`;
}

function aksiVerif(r, verif) {
  if (!verif.length) {
    return `<p class="muted">Belum ada verifikator. Tambahkan dulu di menu Verifikator.</p>`;
  }
  return `
    <div class="verif-row">
      <select data-pilih-verif="${esc(r.id)}" aria-label="Pilih verifikator">
        <option value="">Pilih verifikator…</option>
        ${verif.map(v => `<option value="${esc(v.id)}">${esc(v.nama)}</option>`).join('')}
      </select>
      <button type="button" class="btn sm" data-verif="${esc(r.id)}">${ikon('check')} Verifikasi</button>
    </div>`;
}

async function verifikasiLaporan(id, tombol) {
  const pilih = document.querySelector(`[data-pilih-verif="${id}"]`);
  if (!pilih || !pilih.value) {
    toast('Pilih verifikator terlebih dahulu.', 'err');
    return;
  }
  tombol.disabled = true;
  try {
    await panggil('verifikasi', S.token, id, pilih.value);
    toast('Laporan diverifikasi dan masuk ke Proses Perbaikan', 'ok');
    karakterTanggapi('verifikasi');
    renderPage();
  } catch (err) {
    toast(err.message, 'err');
    tombol.disabled = false;
  }
}

/* ---------- Proses perbaikan ---------- */
async function pageProses() {
  const list = await panggil('prosesList', S.token);
  if (!list.length) {
    return kosongBox(ikon('wrench'), 'Belum ada perbaikan berjalan',
      'Laporan yang sudah diverifikasi akan tampil di sini. Foto bukti wajib diunggah sebelum ditandai selesai.');
  }
  return `<div class="reports stagger">${list.map(r => kartuAdmin(r, aksiSelesai(r))).join('')}</div>`;
}

function aksiSelesai(r) {
  return `
    <div class="meta">
      <span class="status st-diproses">Diperbaiki oleh ${esc(r.verifikator || '-')}</span>
    </div>
    <div class="timer-row">${ikon('timer')} Sudah berjalan <b class="timer" data-mulai="${esc(r.startedAt)}">--:--:--</b></div>
    <form class="form-selesai" data-aksi="selesai" data-id="${esc(r.id)}" autocomplete="off">

        <input type="file" accept="image/jpeg,image/png,image/webp" class="bukti" required>

      </label>
      <button type="submit" class="btn block">${ikon('check')} Tandai Selesai</button>
    </form>`;
}

/** Dipanggil dari Client saat form selesai dikirim */
async function selesaikanLaporan(f) {
  const id = f.dataset.id;
  const bukti = BUKTI.get(id);
  if (!bukti) throw new Error('Pilih foto bukti perbaikan terlebih dahulu.');
  await panggil('selesaikan', S.token, id, bukti);
  BUKTI.delete(id);
  toast('Laporan ditandai selesai. Pelapor mendapat poin', 'ok');
  karakterTanggapi('selesai');
  renderPage();
}

/* ---------- Riwayat selesai ---------- */
async function pageRiwayat() {

    return kosongBox(ikon('check'), 'Belum ada laporan selesai',

  }
  return `
  <div class="stack-list stagger">
    ${list.map(r => `
      <article class="card hist anim-in">
        ${fotoKecil(r.fotoUrl, 'hthumb')}
        <div class="hbody">
          <div class="tags">
            <span class="tag">${esc(r.kategori)}</span>
            <span class="tag">${ikon('pin')} ${esc(r.lokasi)}</span>
          </div>
          <p class="desk">${esc(r.deskripsi)}</p>
          <div class="meta">
            <span>${ikon('user')} ${esc(r.pelapor)}</span>
            <span>${ikon('shield')} ${esc(r.verifikator || '-')}</span>
            <span>${ikon('calendar')} Selesai ${tgl(r.doneAt)}</span>
          </div>
        </div>
        <div class="durasi">
          <small>Waktu pengerjaan</small>
          <b>${durasiTeks(r.durasiMs)}</b>
          ${r.buktiUrl ? `<a class="link" href="${esc(r.buktiUrl)}" target="_blank" rel="noopener">Lihat bukti ↗</a>` : ''}
        </div>
      </article>`).join('')}
  </div>`;
}

/* ---------- Pendengar kejadian ---------- */

/* Tombol verifikasi di Masuk Baru */
document.addEventListener('click', e => {
  const v = e.target.closest('[data-verif]');
  if (v) verifikasiLaporan(v.dataset.verif, v);
});

/* Filter Masuk Baru, dan pilihan foto bukti di Proses Perbaikan */
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.closest('#fFilter')) {
    const f = t.closest('form');
    S.filter = { kategori: f.kategori.value, prioritas: f.prioritas.value, urut: f.urut.value };
    renderPage();
    return;
  }
  if (t.classList.contains('bukti')) {
    const form = t.closest('form');
    const file = t.files[0];
    if (!file) { BUKTI.delete(form.dataset.id); return; }
    try {
      const url = await kompresFoto(file);
      BUKTI.set(form.dataset.id, url);
      t.closest('label').querySelector('.up-txt').innerHTML =
        `<img class="prev" src="${url}" alt="Pratinjau bukti"><small class="ganti">Ketuk untuk ganti foto</small>`;
    } catch (err) {
      BUKTI.delete(form.dataset.id);
      t.value = '';
      toast(err.message, 'err');
    }
  }
});
</script>

  <script>
/* =========================================================
 * HalamanAdminKelola.html — halaman kelola admin (Phase 3), sisi klien
 * Statistik Sekolah, Manajemen Verifikator, dan Pengumuman.
 * ========================================================= */

/* ---------- Pembantu ---------- */

/** Hapus dua tahap: tekan sekali untuk konfirmasi, tekan lagi dalam 3 detik untuk menghapus */
function tekanDua(el, jalankan) {
  if (el.dataset.siap === '1') {
    el.dataset.siap = '';
    jalankan();
    return;
  }
  el.dataset.siap = '1';
  el.textContent = 'Yakin?';
  el.classList.add('danger');
  setTimeout(() => {
    el.dataset.siap = '';
    el.textContent = 'Hapus';
    el.classList.remove('danger');
  }, 3000);
}

/* ---------- Statistik ---------- */

/** Kartu batang horizontal, panjang batang relatif terhadap nilai terbesar */
function kartuBar(ikon, judul, daftar) {
  const maks = Math.max(1, ...daftar.map(x => x.jumlah));
  const baris = daftar.map(x => `
    <div class="bar-row">
      <span class="bar-nama">${esc(x.nama)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(x.jumlah / maks * 100)}%"></div></div>
      <b class="bar-angka">${x.jumlah}</b>
    </div>`).join('');
  return `
    <div class="card span-4 anim-in">
      <div class="card-head"><div class="ic">${ikon}</div><h3>${esc(judul)}</h3></div>
      ${baris}
    </div>`;
}

async function pageStatistik() {
  const s = await panggil('statistikSekolah', S.token);
  const top = s.verifikatorTop.length
    ? s.verifikatorTop.map((v, i) => `
        <div class="rank">
          <div class="pos">${i + 1}</div>
          <div class="nm"><b>${esc(v.nama)}</b><small>Verifikator</small></div>
          <div class="pts">${v.poin} <small>poin</small></div>
        </div>`).join('')
    : '<p class="muted">Belum ada verifikator.</p>';

  return `
  <div class="grid stagger">
    <div class="card span-12 anim-in">
      <div class="card-head"><div class="ic">${ikon('trend')} </div><h3>Ringkasan Sekolah</h3></div>
      <div class="stats">
        <div class="stat"><b>${s.totalSiswa}</b><small>Siswa</small></div>
        <div class="stat"><b>${s.total}</b><small>Total laporan</small></div>
        <div class="stat"><b>${s.menunggu}</b><small>Menunggu</small></div>
        <div class="stat"><b>${s.diproses}</b><small>Diperbaiki</small></div>
        <div class="stat"><b>${s.selesai}</b><small>Selesai</small></div>
        <div class="stat"><b>${s.tingkatSelesai}%</b><small>Tingkat selesai</small></div>
        <div class="stat"><b>${durasiTeks(s.rataRataMs)}</b><small>Rata-rata pengerjaan</small></div>
      </div>
    </div>
    ${kartuBar(ikon('layers'), 'Per Kategori', s.perKategori)}
    ${kartuBar(ikon('pin'), 'Per Lokasi', s.perLokasi)}
    ${kartuBar(ikon('alert'), 'Per Prioritas', s.perPrioritas)}
    <div class="card span-12 anim-in">
      <div class="card-head"><div class="ic">${ikon('trophy')} </div><h3>Verifikator Terbaik</h3></div>
      ${top}
    </div>
  </div>`;
}

/* ---------- Verifikator ---------- */
async function pageVerifikator() {
  const list = await panggil('daftarVerifikator', S.token);
  const daftar = list.length
    ? list.map(v => `
        <div class="rank">
          <div class="pos">${ikon('user')} </div>
          <div class="nm"><b>${esc(v.nama)}</b><small>${v.tugasAktif} laporan sedang diperbaiki</small></div>
          <div class="pts">${v.poin} <small>poin</small></div>
          <button type="button" class="btn ghost sm" data-hapus-verif="${esc(v.id)}">Hapus</button>
        </div>`).join('')
    : '<p class="muted">Belum ada verifikator. Tambahkan lewat form di samping.</p>';

  return `
  <div class="grid">
    <form id="fVerif" class="card span-4 anim-in" autocomplete="off">
      <div class="card-head"><div class="ic">${ikon('plus')} </div><h3>Tambah Verifikator</h3></div>
      <p class="muted">Verifikator adalah pihak yang menangani laporan, misalnya guru atau petugas sekolah.</p>
      <label for="vNama">Nama verifikator</label>
      <input id="vNama" name="nama" maxlength="40" required placeholder="Nama lengkap">
      <button class="btn block" type="submit">Simpan Verifikator</button>
    </form>
    <div class="card span-8 anim-in">
      <div class="card-head"><div class="ic">${ikon('users')} </div><h3>Daftar Verifikator</h3></div>
      ${daftar}
    </div>
  </div>`;
}

async function simpanVerifikator(f) {
  await panggil('tambahVerifikator', S.token, { nama: f.elements.nama.value });
  toast('Verifikator ditambahkan', 'ok');
  karakterTanggapi('verifikator');
  renderPage();
}

/* ---------- Pengumuman ---------- */
async function pagePengumuman() {
  const list = await panggil('daftarPengumuman', S.token);
  const daftar = list.length
    ? list.map(p => `
        <div class="card notif anim-in">
          <div class="ic">${ikon('megaphone')} </div>
          <div class="grow">
            <p>${esc(p.teks)}</p>
            <small>${esc(p.oleh)} · ${tgl(p.createdAt)}</small>
          </div>
          <button type="button" class="btn ghost sm" data-hapus-umum="${esc(p.id)}">Hapus</button>
        </div>`).join('')
    : kosongBox(ikon('inbox'), 'Belum ada pengumuman', 'Pengumuman yang kamu terbitkan akan tampil di beranda siswa.');

  return `
  <div class="grid">
    <form id="fPengumuman" class="card span-5 anim-in" autocomplete="off">
      <div class="card-head"><div class="ic">${ikon('megaphone')} </div><h3>Buat Pengumuman</h3></div>
      <label for="pTeks">Isi pengumuman</label>
      <textarea id="pTeks" name="teks" rows="4" maxlength="300" required
        placeholder="Tulis informasi untuk seluruh siswa"></textarea>
      <div class="counter"><span id="pCount">0</span>/300</div>
      <button class="btn block" type="submit">Terbitkan</button>
    </form>
    <div class="span-7 stack">
      ${daftar}
    </div>
  </div>`;
}

async function simpanPengumuman(f) {
  await panggil('tambahPengumuman', S.token, { teks: f.elements.teks.value });
  toast('Pengumuman diterbitkan', 'ok');
  karakterTanggapi('pengumuman');
  renderPage();
}

/* ---------- Pendengar kejadian ---------- */
document.addEventListener('click', e => {
  const hv = e.target.closest('[data-hapus-verif]');
  if (hv) {
    tekanDua(hv, async () => {
      try {
        await panggil('hapusVerifikator', S.token, hv.dataset.hapusVerif);
        toast('Verifikator dihapus.', 'ok');
        renderPage();
      } catch (err) { toast(err.message, 'err'); }
    });
    return;
  }
  const hu = e.target.closest('[data-hapus-umum]');
  if (hu) {
    tekanDua(hu, async () => {
      try {
        await panggil('hapusPengumuman', S.token, hu.dataset.hapusUmum);
        toast('Pengumuman dihapus.', 'ok');
        renderPage();
      } catch (err) { toast(err.message, 'err'); }
    });
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'pTeks') $('#pCount').textContent = e.target.value.length;
});

<script>
/* =========================================================
 * HalamanCetak.html: cetak surat permohonan izin dengan tabel laporan siswa (admin), sisi klien.
 * Data dari cetakLaporan (Admin.gs). Pratinjau dan cetakan memakai markup yang sama.
 * ========================================================= */

const STATUS_CETAK = { semua: 'Semua status', menunggu: 'Menunggu verifikasi', diproses: 'Sedang diperbaiki', selesai: 'Selesai' };
const STATUS_TABEL = { menunggu: 'Menunggu', diproses: 'Diproses', selesai: 'Selesai' };
const CETAK = {
  data: null,
  filter: { status: 'semua', kelas: '', dari: '', sampai: '' },
  tingkat: '',  // tingkat pemadatan surat, dipilih dari hasil ukur
  muat: true    // false jika surat tetap tidak muat satu halaman walau sudah dipadatkan
};

/* Tanggal yyyy-mm-dd menjadi teks, misalnya 21 Oktober 2026 */
function tglSaja(ymd) {
  return new Date(ymd + 'T00:00:00+07:00').toLocaleDateString('id-ID', { dateStyle: 'long', timeZone: 'Asia/Jakarta' });
}

/* Tanggal dan jam untuk tabel, dua baris: 15 Okt 2026 lalu 09.00 */
function tglSingkat(iso) {
  return new Date(iso).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short', timeZone: 'Asia/Jakarta' }).replace(', ', '<br>');
}

/* Keterangan filter untuk kalimat surat, hanya filter yang dipakai. Contoh: ", dengan status selesai, dari kelas XI-A" */
function frasaFilter() {
  const f = CETAK.filter, bagian = [];
  if (f.status !== 'semua') bagian.push(`dengan status ${STATUS_CETAK[f.status].toLowerCase()}`);
  if (f.kelas) bagian.push(`dari kelas ${f.kelas}`);
  if (f.dari || f.sampai) bagian.push(`pada periode ${f.dari ? tglSaja(f.dari) : 'awal'} s.d. ${f.sampai ? tglSaja(f.sampai) : 'sekarang'}`);
  return bagian.length ? ', ' + bagian.join(', ') : '';
}

function infoCetak() {
  const n = CETAK.data ? CETAK.data.rows.length : 0;
  if (!n) return 'Tidak ada laporan sesuai filter.';
  if (!CETAK.muat) return `${n} laporan terlalu banyak untuk satu halaman A4. Persempit periode atau status.`;
  return `${n} laporan siap dicetak dalam satu halaman A4.`;
}

/* Surat permohonan izin, kop sekolah, dan tabel laporan. Dipakai untuk pratinjau dan cetakan. */
function kertasCetak(tingkat = CETAK.tingkat) {
  const d = CETAK.data;
  const f = CETAK.filter;
  const baris = d.rows.length
    ? d.rows.map((r, i) => `
      <tr>
        <td class="c">${i + 1}</td>
        <td>${tglSingkat(r.createdAt)}</td>
        <td>${esc(r.pelapor)}<br><small>Kelas ${esc(r.kelasPelapor || r.kelas || '-')}</small></td>
        <td>${esc(r.kategori)}</td>
        <td>${esc(r.lokasi)}</td>
        <td>${esc(r.deskripsi)}</td>
        <td>${esc(r.prioritas)}</td>
        <td>${esc(STATUS_TABEL[r.status] || r.status)}</td>
        <td>${esc(r.verifikator || '-')}</td>
        <td>${r.doneAt ? tglSingkat(r.doneAt) : '-'}</td>
      </tr>`).join('')
    : '<tr><td colspan="10" class="c">Tidak ada laporan sesuai filter.</td></tr>';
  const tanggalSurat = new Date(d.dibuat).toLocaleDateString('id-ID', { dateStyle: 'long', timeZone: 'Asia/Jakarta' });
  return `
  <article class="kertas ${tingkat}">
    <header class="kop">
      <img class="kop-logo" src="${LOGO_URL}" alt="Logo sekolah" onerror="this.style.visibility='hidden'">
      <div class="kop-teks">
        <p class="kop-yayasan">YAYASAN DIPONEGORO TUMPANG</p>
        <h2 class="kop-sekolah">SMAS DIPONEGOROTUMPANG</h2>
        <p class="kop-akre">Terakreditasi "A"</p>
        <p class="kop-baris">SK. Ketua BAP. Jawa Timur No. 1857/BAN-SM/SK/2022 &nbsp;|&nbsp; NPSN : 20517794</p>
        <p class="kop-baris">Jl. Tunggul Ametung No. 18 Tumpang Kab. Malang &nbsp;|&nbsp; Telp. 0341-787130 &nbsp;|&nbsp; E-mail : smasdiponegorotumpang@gmail.com</p>
      </div>
    </header>
    <div class="kop-garis"></div>

    <div class="surat">
      <p>Tumpang, ${esc(tanggalSurat)}</p>

      <div class="meta">
        <span>Nomor</span><span>:</span><span>...............................</span>
        <span>Lampiran</span><span>:</span><span>-</span>
        <span>Perihal</span><span>:</span><span><b>Permohonan Izin Tindak Lanjut Laporan Siswa</b></span>
      </div>

      <div class="tujuan">
        <p>Kepada Yth.</p>
        <p><b>Bapak/Ibu Kepala SMAS DIPONEGOROTUMPANG</b></p>
        <p>di Tempat</p>
      </div>

      <p>Dengan hormat,</p>
      <p>Melalui aplikasi LaporBantu Smadita, siswa menyampaikan laporan masalah sarana dan kenyamanan di lingkungan sekolah. Kami memohon izin Bapak/Ibu Kepala Sekolah agar tim sekolah dapat melakukan pemeriksaan dan perbaikan yang diperlukan sesuai daftar berikut.</p>
      <p>Berikut daftar ${d.rows.length} laporan${esc(frasaFilter())} yang dimohonkan untuk ditindaklanjuti.</p>

      <div class="tabel-wrap">
        <table class="tabel-cetak">
          <colgroup>
            <col style="width:4%"><col style="width:10%"><col style="width:11%"><col style="width:8%"><col style="width:10%"><col style="width:23%"><col style="width:7%"><col style="width:8%"><col style="width:9%"><col style="width:10%">
          </colgroup>
          <thead>
            <tr><th class="c">No</th><th>Tanggal lapor</th><th>Pelapor</th><th>Kategori</th><th>Lokasi</th><th>Deskripsi</th><th>Prioritas</th><th>Status</th><th>Verifikator</th><th>Selesai</th></tr>
          </thead>
          <tbody>${baris}</tbody>
        </table>
      </div>

      <p>Demikian permohonan izin ini kami sampaikan. Atas perhatian dan izin Bapak/Ibu, kami ucapkan terima kasih.</p>

      <div class="ttd">
        <p>Hormat kami,</p>
        <div class="ttd-kosong"></div>
        <p class="nama">${esc(d.admin)}</p>
        <p>Admin LaporBantu Smadita</p>
      </div>
    </div>
  </article>`;
}

/* Tingkat pemadatan dari yang paling longgar. Dipilih yang pertama yang muat satu halaman A4. */
const TINGKAT = ['', 'padat', 'ringkas', 'mini'];
const TINGGI_HALAMAN = 269 * 96 / 25.4; // area cetak A4 dengan margin 14 mm atas dan bawah, dalam px

/* Mengukur surat di luar layar dengan lebar cetak yang sama (178 mm), lalu memilih tingkat pemadatan */
function ukurSurat() {
  const uji = document.createElement('div');
  uji.className = 'ukur-surat';
  uji.setAttribute('aria-hidden', 'true');
  document.body.appendChild(uji);
  let pilih = null;
  for (const t of TINGKAT) {
    uji.innerHTML = kertasCetak(t);
    if (uji.querySelector('.kertas').getBoundingClientRect().height <= TINGGI_HALAMAN) { pilih = t; break; }
  }
  uji.remove();
  return pilih === null ? { tingkat: TINGKAT[TINGKAT.length - 1], muat: false } : { tingkat: pilih, muat: true };
}

/* Mengukur ulang lalu memperbarui pratinjau, info, dan tombol Cetak */
function segarSurat() {
  const h = ukurSurat();
  CETAK.tingkat = h.tingkat;
  CETAK.muat = h.muat;
  document.getElementById('cetakPratinjau').innerHTML = kertasCetak();
  document.getElementById('cetakInfo').textContent = infoCetak();
  document.querySelector('[data-cetak]').disabled = !(CETAK.data.rows.length && CETAK.muat);
}

/* Halaman Cetak Laporan: filter, lalu pratinjau surat yang siap dicetak */
async function pageCetak() {
  CETAK.data = await panggil('cetakLaporan', S.token, CETAK.filter);
  const h = ukurSurat();
  CETAK.tingkat = h.tingkat;
  CETAK.muat = h.muat;
  return `
    <form id="fCetak" class="card filterbar anim-in" autocomplete="off">
      <label>Status
        <select name="status">${Object.entries(STATUS_CETAK).map(([v, t]) => `<option value="${v}" ${v === CETAK.filter.status ? 'selected' : ''}>${t}</option>`).join('')}</select>
      </label>
      <label>Kelas
        <select name="kelas">${optsPilih(CFG.kelas, CETAK.filter.kelas, 'Semua kelas')}</select>
      </label>
      <label>Dari tanggal
        <input type="date" name="dari" value="${esc(CETAK.filter.dari)}">
      </label>
      <label>Sampai tanggal
        <input type="date" name="sampai" value="${esc(CETAK.filter.sampai)}">
      </label>
      <button type="submit" class="btn">Tampilkan</button>
    </form>
    <div class="card cetak-bar anim-in">
      <p id="cetakInfo">${infoCetak()}</p>
      <button type="button" class="btn" data-cetak ${CETAK.data.rows.length && CETAK.muat ? '' : 'disabled'}>${ikon('printer')} Cetak</button>
    </div>
    <div id="cetakPratinjau" class="anim-in">${kertasCetak()}</div>`;
}

/* Filter diubah: ambil ulang data, lalu perbarui pratinjau */
document.addEventListener('submit', async e => {
  if (e.target.id !== 'fCetak') return;
  e.preventDefault();
  const f = e.target;
  if (f.dari.value && f.sampai.value && f.dari.value > f.sampai.value) {
    toast('Tanggal "dari" tidak boleh setelah tanggal "sampai".', 'err');
    return;
  }
  const tombol = f.querySelector('button[type="submit"]');
  tombol.disabled = true;
  CETAK.filter = { status: f.status.value, kelas: f.kelas.value, dari: f.dari.value, sampai: f.sampai.value };
  try {
    const data = await panggil('cetakLaporan', S.token, CETAK.filter);
    if (S.halaman !== 'cetak') return; // pengguna sudah pindah halaman
    CETAK.data = data;
    segarSurat();
  } catch (err) {
    if (/Sesi sudah berakhir/.test(err.message)) { paksaKeluar(); return; }
    toast(err.message, 'err');
  } finally {
    tombol.disabled = false;
  }
});

/* Tombol Cetak: isi area cetak (di luar aplikasi), lalu buka dialog cetak */
document.addEventListener('click', async e => {
  if (!e.target.closest('[data-cetak]')) return;
  if (!CETAK.data || !CETAK.data.rows.length) { toast('Tidak ada laporan untuk dicetak.'); return; }
  if (!CETAK.muat) { toast('Laporan terlalu banyak untuk satu halaman A4. Persempit periode atau status.', 'err'); return; }
  document.getElementById('cetakArea').innerHTML = kertasCetak();
  // Tunggu logo dan gambar lain selesai dimuat, supaya ikut tercetak
  await Promise.all([...document.querySelectorAll('#cetakArea img')]
    .map(img => img.decode().catch(() => null)));
  try {
    window.print();
  } catch (err) {
    toast('Dialog cetak tidak bisa dibuka dari sini. Coba buka aplikasi di tab baru.', 'err');
  }
});
</script>

/* Prioritas pesan. Pesan dengan prioritas sama atau lebih rendah masuk antrean. */
const PRIO = { aksi: 4, pengumuman: 3, sapaan: 1 };
const KAR = {
  timer: null, ketik: null, prio: 0, antrean: [],
  sudahSapa: false, pengumumanTerakhir: '', halaman: null
};

const dockEl = () => document.getElementById('dock');
const panelAktif = () => !!dockEl() && !dockEl().classList.contains('hidden');
const potong = (s, n) => (s.length > n ? s.slice(0, n - 1) + '…' : s);

/* ---------- Tampilan ---------- */
function kartuKarakter(id) {
  return `
    <div class="kar-wrap" data-wrap="${id}">
      <button type="button" class="kar napas" data-kar="${id}" aria-label="Sapa karakter" title="${JUDUL_ATUR}">
        <img class="kar-img" alt="" src="${GAMBAR[id].netral}">
        <img class="mulut" alt="" src="${GAMBAR[id].buka}">
      </button>
    </div>`;
}

/* ---------- Ukuran dan posisi karakter (tanpa tombol) ----------
 * Seret karakter untuk memindahkan. Cubit dengan dua jari untuk memperbesar atau memperkecil,
 * atau tahan Ctrl sambil menggulir (laptop). Klik dua kali untuk kembali ke ukuran awal.
 * Ukuran dan posisi disimpan di localStorage (jika diizinkan) dan tetap di dalam layar. */
const JUDUL_ATUR = 'Seret untuk memindahkan. Cubit, atau Ctrl + scroll, untuk memperbesar atau memperkecil. Klik dua kali untuk atur ulang.';
const KEY_ATUR = 'laporbantu_atur_karakter';
const SKALA = { min: 0.6, maks: 1.6 };
const GESER_TEPI = 6;   // jarak minimum dari tepi layar, dalam px
const AMBANG_GESER = 6; // gerakan lebih kecil dari ini masih dianggap klik

function bacaAtur() {
  try {
    const o = JSON.parse(localStorage.getItem(KEY_ATUR) || '{}');
    return o && typeof o === 'object' ? o : {};
  } catch (e) { return {}; }
}
function simpanAtur() {
  try { localStorage.setItem(KEY_ATUR, JSON.stringify(ATUR)); }
  catch (e) { /* diblokir: ukuran tetap berlaku sampai halaman dimuat ulang */ }
}
let ATUR = bacaAtur();

/* Nilai ukuran dan posisi yang aman, meski data tersimpan rusak */
function aturDari(id) {
  const a = ATUR[id] || {};
  return {
    s: Number.isFinite(a.s) ? Math.min(SKALA.maks, Math.max(SKALA.min, a.s)) : 1,
    x: Number.isFinite(a.x) ? a.x : 0,
    y: Number.isFinite(a.y) ? a.y : 0
  };
}

/* Menerapkan ukuran dan posisi ke satu karakter, lalu menjaganya tetap di layar */
function terapkanAtur(wrap) {
  if (!wrap) return;
  const id = wrap.dataset.wrap;
  const a = aturDari(id);
  wrap.style.setProperty('--skala', a.s);
  wrap.style.transform = 'none';
  const r = wrap.getBoundingClientRect(); // posisi tanpa geseran
  if (!r.width) { // belum tampil: pakai nilai tersimpan apa adanya
    wrap.style.transform = `translate(${a.x}px, ${a.y}px)`;
    return;
  }
  const x = Math.min(Math.max(a.x, GESER_TEPI - r.left), window.innerWidth - GESER_TEPI - r.right);
  const y = Math.min(Math.max(a.y, GESER_TEPI - r.top), window.innerHeight - GESER_TEPI - r.bottom);
  ATUR[id] = { s: a.s, x, y };
  wrap.style.transform = `translate(${x}px, ${y}px)`;
}

function aturSemua() {
  document.querySelectorAll('.kar-wrap').forEach(terapkanAtur);
}

/* Mengubah ukuran dengan faktor tertentu, misalnya 1.1 untuk membesar */
function ubahSkala(id, faktor) {
  const wrap = document.querySelector(`.kar-wrap[data-wrap="${id}"]`);
  if (!wrap) return;
  const a = aturDari(id);
  ATUR[id] = { s: a.s * faktor, x: a.x, y: a.y };
  terapkanAtur(wrap);
  simpanAtur();
}

/* Titik sentuh atau kursor yang sedang menekan karakter, dan gerakan yang sedang berlangsung */
const TITIK = new Map();
let GESER = null;
let BARU_DIGESER = false; // true setelah digeser atau dicubit, supaya klik itu tidak memicu sapaan

/* Mencatat posisi awal gerakan dari titik yang masih menekan */
function catatDasar(wrap) {
  const pts = [...TITIK.values()];
  const a = aturDari(wrap.dataset.wrap);
  GESER = {
    id: wrap.dataset.wrap, wrap,
    x0: pts[0].x, y0: pts[0].y,
    ax: a.x, ay: a.y, s0: a.s,
    jarak0: pts.length >= 2 ? Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y) : 0
  };
}

document.addEventListener('pointerdown', e => {
  if (TITIK.size === 0) BARU_DIGESER = false;
  const el = e.target.closest('.kar, .guru-kar');
  const wrap = el && el.closest('.kar-wrap');
  if (!wrap) return;
  if (GESER && GESER.wrap !== wrap) return; // dua karakter berbeda tidak dicubit bersamaan
  TITIK.set(e.pointerId, { x: e.clientX, y: e.clientY });
  try { el.setPointerCapture(e.pointerId); } catch (err) { /* titik tanpa kursor nyata: tetap berjalan */ }
  catatDasar(wrap);
});

document.addEventListener('pointermove', e => {
  if (!TITIK.has(e.pointerId)) return;
  TITIK.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (!GESER) return;
  const g = GESER;
  const pts = [...TITIK.values()];
  if (pts.length >= 2) { // cubit: skala mengikuti jarak dua titik
    if (g.jarak0 <= 0) return;
    const jarak = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
    const a = aturDari(g.id);
    ATUR[g.id] = { s: g.s0 * jarak / g.jarak0, x: a.x, y: a.y };
    BARU_DIGESER = true;
    terapkanAtur(g.wrap);
    return;
  }
  const dx = e.clientX - g.x0;
  const dy = e.clientY - g.y0;
  if (!BARU_DIGESER && Math.hypot(dx, dy) < AMBANG_GESER) return;
  BARU_DIGESER = true;
  g.wrap.classList.add('digeser');
  ATUR[g.id] = { s: aturDari(g.id).s, x: g.ax + dx, y: g.ay + dy };
  terapkanAtur(g.wrap);
});

function lepasTitik(e) {
  if (!TITIK.has(e.pointerId)) return;
  TITIK.delete(e.pointerId);
  if (!GESER) return;
  if (TITIK.size > 0) { catatDasar(GESER.wrap); return; } // sisa satu jari: lanjut dari posisi sekarang
  GESER.wrap.classList.remove('digeser');
  GESER = null;
  simpanAtur();
}
document.addEventListener('pointerup', lepasTitik);
document.addEventListener('pointercancel', lepasTitik);

/* Tahan Ctrl dan gulir (atau cubit pada trackpad) di atas karakter untuk mengubah ukuran */
document.addEventListener('wheel', e => {
  if (!e.ctrlKey) return;
  const wrap = e.target.closest && e.target.closest('.kar-wrap');
  if (!wrap) return;
  e.preventDefault();
  ubahSkala(wrap.dataset.wrap, Math.exp(-e.deltaY * 0.002));
}, { passive: false });

/* Klik dua kali: kembali ke ukuran dan posisi awal */
document.addEventListener('dblclick', e => {
  const wrap = e.target.closest && e.target.closest('.kar-wrap');
  if (!wrap) return;
  ATUR[wrap.dataset.wrap] = { s: 1, x: 0, y: 0 };
  terapkanAtur(wrap);
  simpanAtur();
});

/* Saat layar berubah ukuran, karakter dijaga tetap terlihat */
let aturTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(aturTimer);
  aturTimer = setTimeout(aturSemua, 150);
});

function karakterTampilkan() {
  const peran = S.user && S.user.role;
  const dock = dockEl();
  if (!peran || !dock) return;
  KAR.halaman = null;
  dock.innerHTML = `<div id="gelembung" class="gelembung hidden"></div>` +
    KARAKTER_PER_PERAN[peran].map(id => kartuKarakter(id)).join('');
  dock.classList.remove('hidden');
  aturSemua();
}

function karakterSembunyikan() {
  berhentiBicara(true);
  if (dockEl()) dockEl().classList.add('hidden');
}

/* ---------- Pusat pesan ---------- */
function karakterBicara(id, teks, reaksi = 'senang', prio = PRIO.sapaan, pendamping = true) {
  if (!panelAktif()) return;
  if (KAR.timer && prio <= KAR.prio) {
    if (KAR.antrean.length < 3) KAR.antrean.push({ id, teks, reaksi, prio, pendamping });
    return;
  }
  tampilkanPesan(id, teks, reaksi, prio, pendamping);
}

function tampilkanPesan(id, teks, reaksi, prio, pendamping) {
  const dock = dockEl();
  const pembicara = dock && dock.querySelector(`[data-kar="${id}"]`);
  const g = document.getElementById('gelembung');
  if (!pembicara || !g) return;
  clearTimeout(KAR.timer);
  dock.querySelectorAll('.kar').forEach(k => k.classList.remove('bicara', 'senang', 'angguk', 'khawatir'));
  pembicara.classList.add('bicara');
  mainkanReaksi(pembicara, reaksi);
  if (pendamping) {
    const lain = [...dock.querySelectorAll('.kar')].find(k => k !== pembicara);
    if (lain) mainkanReaksi(lain, 'angguk');
  }
  g.classList.remove('hidden');
  ketikTeks(g, teks);
  KAR.prio = prio;
  KAR.timer = setTimeout(selesaiBicara, Math.min(9000, 2600 + teks.length * 55));
}

/* Memutar ulang animasi reaksi (senang, angguk, khawatir) */
function mainkanReaksi(el, kelas) {
  el.classList.remove('senang', 'angguk', 'khawatir');
  void el.offsetWidth;
  el.classList.add(kelas);
}

function ketikTeks(el, teks) {
  clearInterval(KAR.ketik);
  let i = 0;
  el.textContent = '';
  KAR.ketik = setInterval(() => {
    i++;
    el.textContent = teks.slice(0, i);
    if (i >= teks.length) clearInterval(KAR.ketik);
  }, 22);
}

/* Pesan selesai ditampilkan: lanjut ke antrean jika ada */
function selesaiBicara() {
  berhentiBicara(false);
  const berikut = KAR.antrean.shift();
  if (berikut) tampilkanPesan(berikut.id, berikut.teks, berikut.reaksi, berikut.prio, berikut.pendamping);
}

function berhentiBicara(semua) {
  clearTimeout(KAR.timer);
  clearInterval(KAR.ketik);
  KAR.timer = null;
  KAR.prio = 0;
  if (semua) KAR.antrean = [];
  document.querySelectorAll('.kar').forEach(k => k.classList.remove('bicara', 'senang', 'angguk', 'khawatir'));
  const g = document.getElementById('gelembung');
  if (g) g.classList.add('hidden');
}

/* Setelah animasi reaksi selesai, karakter kembali ke gerak napas */
document.addEventListener('animationend', e => {
  if (e.target.classList && e.target.classList.contains('kar')) {
    e.target.classList.remove('senang', 'angguk', 'khawatir');
  }
});

/* Dipanggil setiap kali halaman berganti. Render ulang halaman yang sama tidak memicu sapaan. */
function karakterNavigasi(halaman) {
  if (!S.user || KAR.halaman === halaman) return;
  KAR.halaman = halaman;
  KAR.sudahSapa = false;
  if (KAR.prio <= PRIO.sapaan) berhentiBicara(true);
  const sapa = SAPA_HALAMAN[S.user.role][halaman];
  if (sapa) {
    KAR.sudahSapa = true;
    karakterBicara(sapa[0], sapa[1], 'angguk', PRIO.sapaan);
  }
}

/* ---------- Sapaan berdasarkan data (sekali per kunjungan beranda) ---------- */

/* Beranda siswa: pengumuman terbaru (sekali per sesi), lalu ringkasan laporan */
function karakterSapaSiswa(d) {
  if (KAR.sudahSapa || !panelAktif()) return;
  KAR.sudahSapa = true;
  const nama = S.user.nama.split(' ')[0];
  const baru = d.pengumuman[0];
  if (baru && baru.id !== KAR.pengumumanTerakhir) {
    KAR.pengumumanTerakhir = baru.id;
    karakterBicara('murid2', 'Ada pengumuman terbaru: ' + potong(baru.teks, 110), 'angguk', PRIO.pengumuman);
  }
  const aktif = d.laporan.menunggu + d.laporan.diproses;
  karakterBicara('murid1',
    aktif > 0
      ? `Hai ${nama}! Ada ${aktif} laporanmu yang sedang ditangani.`
      : `Hai ${nama}! Belum ada laporan yang sedang ditangani. Yuk lapor!`,
    'senang', PRIO.sapaan);
}

/* Beranda admin: antrean dulu, lalu kondisi sekolah */
function karakterSapaAdmin(d) {
  if (KAR.sudahSapa || !panelAktif()) return;
  KAR.sudahSapa = true;
  karakterBicara('guru1',
    d.menunggu > 0
      ? `Ada ${d.menunggu} laporan yang menunggu verifikasi.`
      : 'Tidak ada laporan yang menunggu. Kerja bagus!',
    'angguk', PRIO.sapaan);
  if (d.menungguTinggi >= 3) {
    karakterBicara('guru2', `Ada ${d.menungguTinggi} laporan prioritas Tinggi yang menunggu. Yuk segera ditangani.`, 'khawatir', PRIO.sapaan);
  } else if (d.menunggu === 0 && d.diproses === 0) {
    karakterBicara('guru2', 'Semua laporan beres! Sekolah jadi lebih nyaman.', 'senang', PRIO.sapaan);
  } else {
    karakterBicara('guru2', 'Perbaikan sedang berjalan. Terus semangat!', 'angguk', PRIO.sapaan);
  }
}

/* ---------- Guru di halaman masuk: bicara setiap layar masuk dibuka ---------- */
const PESAN_MASUK = 'Ayo wujudkan Sekolah yang aman, nyaman dan tentram';
const MASUK = { timer: null, ketik: null };

function karakterLogin() {
  const hero = document.querySelector('#auth .auth-hero');
  if (!hero) return;
  if (!document.getElementById('guruLogin')) {
    const wadah = document.createElement('div');
    wadah.id = 'guruLogin';
    wadah.className = 'guru-login';
    wadah.innerHTML = `
      <div class="kar-wrap" data-wrap="masuk">
        <button type="button" class="guru-kar" aria-label="Dengarkan pesan guru" title="${JUDUL_ATUR}">
          <img class="kar-img" alt="" src="${GAMBAR.guru2.netral}">
          <img class="mulut" alt="" src="${GAMBAR.guru2.buka}">
        </button>
      </div>
      <div class="guru-gelembung" id="guruTeks" aria-live="polite"></div>`;
    wadah.querySelector('.guru-kar').addEventListener('click', () => { if (!BARU_DIGESER) bicaraMasuk(); });
    hero.appendChild(wadah);
    terapkanAtur(wadah.querySelector('.kar-wrap'));
  }
  bicaraMasuk();
}

function bicaraMasuk() {
  const kar = document.querySelector('#guruLogin .guru-kar');
  const teks = document.getElementById('guruTeks');
  if (!kar || !teks) return;
  clearTimeout(MASUK.timer);
  clearInterval(MASUK.ketik);
  kar.classList.add('bicara');
  let i = 0;
  teks.textContent = '';
  MASUK.ketik = setInterval(() => {
    i++;
    teks.textContent = PESAN_MASUK.slice(0, i);
    if (i >= PESAN_MASUK.length) clearInterval(MASUK.ketik);
  }, 45);
  MASUK.timer = setTimeout(() => kar.classList.remove('bicara'), PESAN_MASUK.length * 45 + 800);
}

/* localStorage sering diblokir di iframe Apps Script, jadi selalu dibungkus try/catch.
   Jika diblokir, token hanya disimpan di memori (login perlu diulang saat halaman di-refresh). */
const memoriToken = { v: '' };
function ambilToken() {
  try { return localStorage.getItem(KEY_TOKEN) || memoriToken.v || ''; }
  catch (e) { return memoriToken.v || ''; }
}
function simpanToken(v) {
  memoriToken.v = v;
  try { localStorage.setItem(KEY_TOKEN, v); } catch (e) { /* diblokir, pakai memori */ }
}
function hapusToken() {
  memoriToken.v = '';
  try { localStorage.removeItem(KEY_TOKEN); } catch (e) { /* diblokir, abaikan */ }
}

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* Pemanggil server: mengirim permintaan ke API Apps Script lewat fetch.
   Ganti alamat di API_URL dengan URL deployment Apps Script (berakhiran /exec). */
const API_URL = 'https://script.google.com/macros/s/AKfycbzFnXqK0GdDQtZ8mu2km-pnuC_yElS68mhLcYYci54hYGH5HlTLESfQkCVLd7njVzsRKg/exec';
async function panggil(fn, ...args) {
  if (API_URL.startsWith('GANTI')) {
    throw new Error('Alamat server belum diisi. Buka index.html dan isi API_URL.');
  }
  let respon;
  try {
    respon = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: fn, args: args })
    });
  } catch (e) {
    throw new Error('Tidak bisa terhubung ke server. Periksa koneksi internet.');
  }
  let j;
  try { j = await respon.json(); }
  catch (e) { throw new Error('Server belum merespons dengan benar. Coba lagi sebentar lagi.'); }
  if (!j || !j.ok) throw new Error((j && j.error) || 'Terjadi kesalahan.');
  return j.data;
}

let toastTimer;
function toast(msg, tipe = '') {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show ' + tipe;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = 'toast'; }, 2800);
}

function showAuth() {
  karakterSembunyikan();
  $('#app').classList.add('hidden');
  $('#auth').classList.remove('hidden');
  renderAuth();
  karakterLogin();
}

function renderAuth() {
  $('#authSeg').innerHTML = `
    <div class="seg">
      <button type="button" data-tab="siswa" class="${S.tab === 'siswa' ? 'on' : ''}">${ikon('graduation')} Siswa</button>
      <button type="button" data-tab="admin" class="${S.tab === 'admin' ? 'on' : ''}">${ikon('shield')} Admin</button>
    </div>`;
  let html;
  if (S.tab === 'admin') html = S.adaAdmin ? formMasuk('admin') : formAdminPertama();
  else html = S.mode === 'daftar' ? formDaftar() : formMasuk('siswa');
  $('#formArea').innerHTML = `<div class="anim-in">${html}</div>`;
}

function formMasuk(peran) {
  const judul = peran === 'admin' ? 'Masuk sebagai Admin' : 'Masuk sebagai Siswa';
  return `
    <h2 class="title">${judul}</h2>
    <p class="muted">Gunakan username dan password akunmu.</p>
    <form id="fMasuk" data-peran="${peran}">
      <label for="mUser">Username</label>
      <input id="mUser" name="username" autocomplete="username" required>
      <label for="mPass">Password</label>
      <input id="mPass" name="password" type="password" autocomplete="current-password" required>
      <button class="btn block" type="submit">Masuk</button>
    </form>
    ${peran === 'siswa' ? `<p class="switch">Belum punya akun? <button type="button" class="link" data-mode="daftar">Daftar sebagai siswa</button></p>` : ''}`;
}

/* ---------- Aplikasi ---------- */
function enterApp() {
  $('#auth').classList.add('hidden');
  $('#app').classList.remove('hidden');
  renderShell();
  karakterTampilkan();
  renderPage();
}

/** Jumlah lencana di menu: notifikasi untuk siswa, antrian masuk untuk admin */
function jumlahBadge(id) {
  return ({ notif: S.notifBelum, masuk: S.antrian })[id] || 0;
}

function renderShell() {
  const u = S.user;
  const menu = MENU[u.role];
  const inisial = u.nama.split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase();
  $('#side').innerHTML = `
    <div class="brand"><img class="logo-img" src="${LOGO_URL}" alt="Logo LaporBantu Smadita" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'logo-lg',textContent:'LB'}))"><div><b>LaporBantu Smadita</b><small>SMAS Diponegoro Tumpang</small></div></div>
    ${menu.map(m => {
      const aktif = AKTIF[u.role].includes(m.id);
      const n = jumlahBadge(m.id);
      const badge = n > 0 ? `<span class="badge">${n}</span>` : '';
      return `<button type="button" class="nav-item ${S.halaman === m.id ? 'on' : ''} ${aktif ? '' : 'lock'}" data-go="${m.id}">
        <span>${ikon(m.ic)}</span>${m.t}${badge}${aktif ? '' : `<span class="fase">Phase ${m.fase}</span>`}
      </button>`;
    }).join('')}
    <div class="side-foot">
      <div class="userchip"><div class="avatar">${u.fotoUrl ? `<img src="${esc(u.fotoUrl)}" alt="">` : esc(inisial)}</div>
        <div><b>${esc(u.nama)}</b><small>${u.role === 'admin' ? 'Admin' : 'Kelas ' + esc(u.kelas)}</small></div>
      </div>
      <button type="button" class="btn ghost block" data-act="logout">Keluar</button>
    </div>`;
}

/** Menampilkan halaman aktif. Skeleton dulu, lalu isi saat data dari server datang. */
async function renderPage() {
  const role = S.user.role;
  const m = MENU[role].find(x => x.id === S.halaman) || MENU[role][0];
  S.halaman = m.id;
  karakterNavigasi(m.id);
  const req = ++S.reqId; // mencegah jawaban lama menimpa halaman yang sudah diganti
  clearInterval(S.timer);
  const kepala = `<div class="topbar anim-in"><h1>${m.t}</h1><p>${esc(SUB[m.id] || '')}</p></div>`;
  $('#main').innerHTML = kepala + `
    <div class="grid">
      <div class="skeleton span-8"></div>
      <div class="skeleton span-4"></div>
      <div class="skeleton span-12"></div>
    </div>`;
  let isi;
  try {
    isi = await HALAMAN[role][m.id]();
  } catch (err) {
    if (req !== S.reqId) return;
    if (/Sesi sudah berakhir/.test(err.message)) { paksaKeluar(); return; }
    isi = `<div class="card errbox anim-in">
      <h3>Gagal memuat halaman</h3>
      <p class="muted">${esc(err.message)}</p>
      <button type="button" class="btn ghost" data-retry="1">Coba lagi</button>
    </div>`;
  }
  if (req !== S.reqId) return;
  $('#main').innerHTML = kepala + isi;
  animasiAngka();
  aktifkanTimer();
  updateBadge();
}

/** Memperbarui lencana di seluruh menu sesuai jumlahBadge */
function updateBadge() {
  document.querySelectorAll('.nav-item[data-go]').forEach(el => {
    el.querySelectorAll('.badge').forEach(b => b.remove());
    const n = jumlahBadge(el.dataset.go);
    if (n > 0) el.insertAdjacentHTML('beforeend', `<span class="badge">${n}</span>`);
  });
}

/** Sesi tidak berlaku lagi: kembali ke halaman masuk */
function paksaKeluar() {
  hapusToken();
  S.token = '';
  S.user = null;
  S.halaman = 'beranda';
  S.notifBelum = 0;
  S.antrian = 0;
  showAuth();
  toast('Sesi sudah berakhir. Silakan login kembali.', 'err');
}
