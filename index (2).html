/* Jendela info untuk halaman masuk (sebelum login) */
function bukaInfo() {
  let o = document.getElementById('infoOverlay');
  if (!o) {
    o = document.createElement('div');
    o.id = 'infoOverlay';
    o.className = 'info-overlay';
    o.innerHTML = `<div class="info-sheet"><button type="button" class="btn ghost sm info-tutup" data-tutup-info>Tutup</button><div class="info-isi"></div></div>`;
    document.body.appendChild(o);
  }
  o.querySelector('.info-isi').innerHTML = pageInfo();
  o.classList.remove('hidden');
  o.scrollTop = 0;
}

function tutupInfo() {
  const o = document.getElementById('infoOverlay');
  if (o) o.classList.add('hidden');
}

/* ---------- Sesi ---------- */
function simpanSesi(res) {
  S.token = res.token;
  S.user = res.user;
  S.halaman = 'beranda';
  simpanToken(res.token);
  enterApp();
  toast('Selamat datang, ' + res.user.nama.split(' ')[0] + '', 'ok');
}

async function logout() {
  try { await panggil('keluar', S.token); } catch (err) { /* sesi tetap dihapus di sisi klien */ }
  hapusToken();
  S.token = '';
  S.user = null;
  S.halaman = 'beranda';
  S.tab = 'siswa';
  S.mode = 'masuk';
  S.notifBelum = 0;
  S.antrian = 0;
  clearInterval(S.timer);
  showAuth();
  toast('Kamu sudah keluar.', 'ok');
}

/* ---------- Event ---------- */

/* Foto laporan siswa: dikecilkan dulu di browser, lalu pratinjau ditampilkan */
document.addEventListener('change', async e => {
  if (e.target.id !== 'fotoInput') return;
  const file = e.target.files[0];
  if (!file) return;
  try {
    S.fotoData = await kompresFoto(file);
    $('#fotoPrev').innerHTML = `<img class="prev" src="${S.fotoData}" alt="Pratinjau foto"><small class="ganti">Ketuk untuk ganti foto</small>`;
  } catch (err) {
    S.fotoData = '';
    e.target.value = '';
    toast(err.message, 'err');
  }
});

/* Penghitung karakter deskripsi laporan */
document.addEventListener('input', e => {
  if (e.target.id === 'lDesk') $('#lCount').textContent = e.target.value.length;
});

document.addEventListener('click', e => {
  if (e.target.closest('[data-info-login]')) { bukaInfo(); return; }
  if (e.target.closest('[data-tutup-info]') || e.target.id === 'infoOverlay') { tutupInfo(); return; }
  const tab = e.target.closest('[data-tab]');
  if (tab) { S.tab = tab.dataset.tab; S.mode = 'masuk'; renderAuth(); return; }

  const mode = e.target.closest('[data-mode]');
  if (mode) { S.mode = mode.dataset.mode; renderAuth(); return; }

  const go = e.target.closest('[data-go]');
  if (go) {
    const id = go.dataset.go;
    if (!AKTIF[S.user.role].includes(id)) {
      const m = MENU[S.user.role].find(x => x.id === id);
      toast(m.t + ' akan dikerjakan di Phase ' + m.fase + '.');
      return;
    }
    S.halaman = id;
    renderShell();
    renderPage();
    return;
  }

  const dk = e.target.closest('[data-dukung]');
  if (dk) {
    dk.disabled = true;
    dukungLaporan(dk.dataset.dukung)
      .then(() => renderPage())
      .catch(err => { toast(err.message, 'err'); dk.disabled = false; });
    return;
  }

  if (e.target.closest('[data-retry]')) { renderPage(); return; }

  const act = e.target.closest('[data-act]');
  if (act && act.dataset.act === 'logout') logout();
});

document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  const btn = f.querySelector('button[type="submit"]');
  const d = Object.fromEntries(new FormData(f).entries());
  if (f.id === 'fGanti' && d.baru !== d.ulang) {
    toast('Konfirmasi password baru belum sama.', 'err');
    return;
  }
  btn.disabled = true;
  btn.classList.add('loading');
  try {
    if (f.id === 'fMasuk') {
      simpanSesi(await panggil('masuk', { peran: f.dataset.peran, username: d.username, password: d.password }));
    } else if (f.id === 'fDaftar') {
      simpanSesi(await panggil('daftarSiswa', d));
    } else if (f.id === 'fLapor') {
      await kirimLapor(f);
    } else if (f.id === 'fVerif') {
      await simpanVerifikator(f);
    } else if (f.id === 'fPengumuman') {
      await simpanPengumuman(f);
    } else if (f.dataset.aksi === 'selesai') {
      await selesaikanLaporan(f);
    } else if (f.id === 'fAdminPertama') {
      simpanSesi(await panggil('buatAdminPertama', d));
    } else if (f.id === 'fGanti') {
      await panggil('gantiPassword', S.token, { lama: d.lama, baru: d.baru });
      f.reset();
      toast('Password berhasil diganti.', 'ok');
    }
  } catch (err) {
    toast(err.message, 'err');
  } finally {
    btn.disabled = false;
    btn.classList.remove('loading');
  }
});

/* ---------- Angka yang naik perlahan (statistik dan poin) ---------- */
function animasiAngka(akar = document) {
  const kurangiGerak = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  akar.querySelectorAll('[data-angka], .stat b').forEach(el => {
    const teks = el.dataset.angka !== undefined ? el.dataset.angka : el.textContent.trim();
    if (!/^\d+$/.test(teks)) return;
    const target = Number(teks);
    if (kurangiGerak || target === 0) { el.textContent = teks; return; }
    el.textContent = '0';
    const mulai = performance.now();
    const langkah = now => {
      const t = Math.min(1, (now - mulai) / 900);
      el.textContent = Math.round(target * (1 - Math.pow(1 - t, 3)));
      if (t < 1) requestAnimationFrame(langkah);
    };
    requestAnimationFrame(langkah);
  });
}

/* ---------- Ganti foto profil siswa ---------- */
document.addEventListener('click', e => {
  if (e.target.closest('[data-ganti-foto]')) $('#fotoProfil').click();
});
document.addEventListener('change', async e => {
  if (!e.target.matches('#fotoProfil')) return;
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const tombol = document.querySelector('[data-ganti-foto]');
  if (tombol) tombol.disabled = true;
  try {
    const dataUrl = await kompresFoto(file);
    const hasil = await panggil('gantiFotoProfil', S.token, dataUrl);
    S.user.fotoUrl = hasil.fotoUrl;
    renderShell();
    await renderPage();
    toast('Foto profil diperbarui.', 'ok');
  } catch (err) {
    toast(err.message, 'err');
    if (tombol) tombol.disabled = false;
  }
});

/* ---------- Start ---------- */
async function init() {
  try {
    CFG = await panggil('konfigKlien');
    const awal = await panggil('muatAwal', S.token);
    S.adaAdmin = awal.adaAdmin;
    if (awal.user) {
      S.user = awal.user;
      enterApp();
    } else {
      S.token = '';
      hapusToken();
      showAuth();
    }
  } catch (err) {
    toast(err.message, 'err');
    showAuth();
  } finally {
    $('#loader').classList.add('hidden');
  }
}
init();
</script>
